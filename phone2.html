<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flair - phone cards v2</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ar:4/5}
body.r916{--ar:9/16}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f4f1;color:#151515;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
header{padding:56px 0 0}
header h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:40px;letter-spacing:-.01em}
header p{margin-top:6px;color:#7a7a7a;font-size:15px;max-width:620px;line-height:1.5}
.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;background:#fff;border:1px solid #e6e4df;border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:none;padding:7px 12px;border-radius:7px;color:#666;cursor:pointer}
.seg button.on{background:#151515;color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{font-size:13px;font-weight:500;color:#555;text-decoration:none;background:#fff;border:1px solid #e6e4df;border-radius:8px;padding:6px 11px}
nav a.on{background:#151515;color:#fff;border-color:#151515}
section{padding:54px 0 0}
.sh{display:flex;align-items:baseline;gap:12px}
.sh h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sh span{font-size:14px;color:#8a8a8a}
.sh a{margin-left:auto;font-size:13px;font-weight:500;color:#555;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:18px}
.card{position:relative;aspect-ratio:var(--ar);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -22px rgba(0,0,0,.25)}
.one{white-space:nowrap;overflow:hidden}
.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.name{position:absolute;left:18px;right:18px;top:20px;text-align:center;z-index:3}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:33px;line-height:1;letter-spacing:-.01em}
.grot{font-family:"Bricolage Grotesque",Geist,sans-serif;font-weight:700;font-size:27px;line-height:1;letter-spacing:-.035em}
.phone{position:absolute;left:50%;transform:translateX(-50%);top:70px;bottom:-40px;width:60%;border-radius:30px;overflow:hidden;z-index:1}
.phone .ph{position:absolute;inset:0;background:#ccc center/cover no-repeat}
.phone::after{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:30%;height:9px;border-radius:99px;background:#111;z-index:2}
.glass{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;border-radius:18px;padding:12px 15px 13px;-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.glass .h{font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.glass .sub{font-size:12.5px;line-height:1.4;margin-top:3px}
.gl-light{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px -12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.9)}
.gl-light .h{color:#141414}.gl-light .sub{color:#4d4b48}
.gl-dark{background:rgba(18,18,18,.42);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px -12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.gl-dark .h{color:#fff}.gl-dark .sub{color:rgba(255,255,255,.78)}
/* A */
.a .phone{border:2.5px solid #161616;box-shadow:0 18px 40px -14px rgba(0,0,0,.35)}
/* B */
.b .name{text-align:left;left:20px}
.b .phone{border:2px solid #d4d2cd;box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 22px 44px -16px rgba(0,0,0,.3);background:#fff}
.b .phone::after{background:#1a1a1a}
/* C */
.c .name{text-align:left;left:20px}
.c .name.serif{font-style:italic}
.c .phone{border:2.5px solid #161616;transform:translateX(-44%) rotate(-7deg);top:78px;width:58%;box-shadow:18px 24px 40px -18px rgba(0,0,0,.4)}
/* D */
.d .name{color:#fff}
.d .phone{border:2px solid #4a4a4a;box-shadow:0 20px 50px -14px rgba(0,0,0,.6)}
.d .phone::after{background:#000}
/* E (rework of 10) */
.e .ph{position:absolute;inset:0;background:#ccc center/cover no-repeat}
.e .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.25))}
.e .name{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.35)}
footer{height:90px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Phone cards, v2</h1>
  <p id="intro">Built from design 6. App name in a display font on top, thin phone frame, copy on a glass card at the bottom. Toggle 4:5 (hero ratio) or 9:16 (phone).</p>
  <div class="bar"><div class="seg" id="seg"><button data-r="45">4:5 (hero)</button><button data-r="916">9:16 (phone)</button></div><nav id="nav"></nav></div>
</header>
<main id="main"></main>
<footer></footer>
</div>
<script>
const T={"couples": {"l": "#dfcdc7", "l2": "#c8a99e", "d": "#270a00"}, "date-night": {"l": "#e8d6cd", "l2": "#d8b9a9", "d": "#36190a"}, "family": {"l": "#f4e8de", "l2": "#ecd8c6", "d": "#473525"}, "fitness": {"l": "#d9d6d7", "l2": "#beb9b9", "d": "#1e1919"}, "gift": {"l": "#ecd8d0", "l2": "#dfbcaf", "d": "#3c1b0f"}, "home": {"l": "#ded5cd", "l2": "#c6b7a9", "d": "#25170a"}, "learning": {"l": "#e9ded7", "l2": "#dac7bb", "d": "#37251a"}, "matchmaking": {"l": "#f1e0d8", "l2": "#e7cabd", "d": "#43291c"}, "nutrition": {"l": "#dfdcd2", "l2": "#c8c4b1", "d": "#262312"}, "parent": {"l": "#f6eae3", "l2": "#f0dccf", "d": "#4c392d"}, "pet": {"l": "#fbe8d5", "l2": "#f9d8b7", "d": "#543517"}, "plant": {"l": "#e1dcce", "l2": "#cbc3aa", "d": "#29220b"}, "skin": {"l": "#f9e4dd", "l2": "#f6d1c4", "d": "#512f23"}, "travel": {"l": "#e3e1dd", "l2": "#d0cbc5", "d": "#2e2923"}, "wardrobe": {"l": "#e0dbd9", "l2": "#cbc0bd", "d": "#29201c"}};
const V=[['a','A · Serif','Serif name, thin black frame, light glass'],['b','B · Grotesk','Bold grotesk name, thin silver frame, light glass'],['c','C · Tilted','Italic serif name, tilted phone, light glass'],['d','D · Night','Deep background, white serif name, dark glass'],['e','E · Full photo','Rework of 10: full photo, serif name on top, glass card']];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(k,c){
 const key=c.image.split('/').pop().replace('.jpg',''),t=T[key]||{l:'#eee',l2:'#ddd',d:'#222'},img=`/card-images/v3/${key}.jpg`;
 const N=esc(c.name),H=esc(c.head),S=esc(c.sub),ph=`<div class="ph" style="background-image:url('${img}')"></div>`;
 const glass=(dark)=>`<div class="glass ${dark?'gl-dark':'gl-light'}"><div class="h one">${H}</div><div class="sub">${S}</div></div>`;
 if(k==='e')return `<div class="card e">${ph}<div class="name serif one">${N}</div>${glass(false)}</div>`;
 const bg=k==='d'?`radial-gradient(120% 80% at 50% 0%,${t.d} 0%,#0d0d0d 100%)`:k==='b'?`linear-gradient(180deg,#fbfaf8,${t.l})`:`linear-gradient(180deg,${t.l},${t.l2})`;
 const font=k==='b'?'grot':'serif';
 return `<div class="card ${k}" style="background:${bg}"><div class="name ${font} one">${N}</div><div class="phone">${ph}</div>${glass(k==='d')}</div>`;
}
function fit(){document.querySelectorAll('.one').forEach(h=>{h.style.fontSize='';let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+.5&&s>10){s-=.5;h.style.fontSize=s+'px';}});}
const q=new URLSearchParams(location.search),is916=q.get('r')==='916';
if(is916)document.body.classList.add('r916');
document.querySelectorAll('#seg button').forEach(b=>{b.classList.toggle('on',(b.dataset.r==='916')===is916);b.onclick=()=>{if(b.dataset.r==='916')q.set('r','916');else q.delete('r');location.search=q.toString();};});
fetch('/cards.json').then(r=>r.json()).then(cards=>{cards=cards.filter(c=>c.id<=15);
 const only=q.get('v'),rq=is916?'&r=916':'';
 document.getElementById('nav').innerHTML=`<a href="/phone2${is916?'?r=916':''}" class="${only?'':'on'}">Compare</a>`+V.map(v=>`<a href="/phone2?v=${v[0]}${rq}" class="${only===v[0]?'on':''}">${v[1]}</a>`).join('');
 const list=only?V.filter(v=>v[0]===only):V,sample=[1,4,9,11];
 document.getElementById('main').innerHTML=list.map(v=>{const cs=only?cards:sample.map(i=>cards.find(c=>c.id===i));return `<section><div class="sh"><h2>${v[1]}</h2><span>${v[2]}</span>${only?'':`<a href="/phone2?v=${v[0]}${rq}">All 15 &rarr;</a>`}</div><div class="grid">${cs.map(c=>card(v[0],c)).join('')}</div></section>`}).join('');
 (document.fonts?document.fonts.ready:Promise.resolve()).then(fit);addEventListener('resize',fit);
});
</script>
</body>
</html>
