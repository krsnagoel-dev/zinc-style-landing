<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flair - phone card designs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--ar:4/5}
body.r916{--ar:9/16}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f6f4;color:#141414;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
header{padding:56px 0 0}
header h1{font-size:26px;font-weight:600;letter-spacing:-.03em}
header p{margin-top:8px;color:#777;font-size:15px;max-width:640px;line-height:1.5}
.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;background:#fff;border:1px solid #e4e4e0;border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;padding:7px 12px;border-radius:7px;color:#666;cursor:pointer}
.seg button.on{background:#141414;color:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{font-size:13px;font-weight:600;color:#555;text-decoration:none;background:#fff;border:1px solid #e4e4e0;border-radius:8px;padding:6px 11px}
nav a.on{background:#141414;color:#fff;border-color:#141414}
section{padding:52px 0 0}
.sh{display:flex;align-items:baseline;gap:12px}
.sh h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.sh h2 b{color:#aaa;font-weight:600;margin-right:6px}
.sh span{font-size:14px;color:#888}
.sh a{margin-left:auto;font-size:13px;font-weight:600;color:#555;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin-top:18px}
.card{position:relative;aspect-ratio:var(--ar);border-radius:22px;overflow:hidden;background:#222;box-shadow:0 20px 40px -18px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.06)}
.ph{position:absolute;inset:0;background:#ddd center/cover no-repeat}
.one{white-space:nowrap;overflow:hidden}
.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);color:#141414;font-size:12px;font-weight:700;border-radius:99px;padding:6px 11px;max-width:100%;letter-spacing:-.01em}
.pill i{width:6px;height:6px;border-radius:50%;background:#1fb35a;flex:none}
.fill{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;z-index:2}
.fill .bot{margin-top:auto}
.h{font-weight:700;letter-spacing:-.035em;line-height:1.1}
/* 1 Hero */
.v1 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18),transparent 28%,transparent 42%,rgba(0,0,0,.9) 88%)}
.v1 .h{color:#fff;font-size:22px}
.v1 .sub{color:rgba(255,255,255,.86);font-size:14px;line-height:1.35;margin-top:6px}
/* 2 White frame */
.v2{background:#fff;padding:10px;display:flex;flex-direction:column}
.v2 .imgbox{position:relative;flex:1;border-radius:15px;overflow:hidden}
.v2 .imgbox .pill{position:absolute;top:10px;left:10px;z-index:2}
.v2 .txt{padding:14px 6px 6px}
.v2 .h{font-size:20px;color:#141414}
.v2 .sub{font-size:13.5px;color:#6e6e6e;line-height:1.4;margin-top:4px}
/* 3 Buy chip */
.v3 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 26%,transparent 36%,rgba(0,0,0,.92) 78%)}
.v3 .nm{color:#fff;font-size:15px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.v3 .h{color:#fff;font-size:21px}
.v3 .sub{color:rgba(255,255,255,.85);font-size:13.5px;line-height:1.35;margin-top:5px}
.v3 .buy{margin-top:12px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:9px 10px 9px 14px}
.v3 .buy span{font-size:13px;font-weight:700;color:#141414}
.v3 .buy em{font-style:normal;font-size:12px;font-weight:700;background:#141414;color:#fff;border-radius:9px;padding:6px 10px}
/* 4 Glass */
.v4 .glass{margin-top:auto;background:rgba(20,20,20,.32);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:14px;color:#fff}
.v4 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.35))}
.v4 .nm{font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.v4 .h{font-size:20px;margin-top:6px}
.v4 .sub{font-size:13.5px;line-height:1.35;margin-top:4px;opacity:.92}
/* 5 Color block */
.v5{display:flex;flex-direction:column}
.v5 .blk{padding:18px 16px 16px;color:#fff}
.v5 .nm{font-size:12px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.v5 .h{font-size:22px;margin-top:8px}
.v5 .sub{font-size:13.5px;line-height:1.35;margin-top:6px;opacity:.88}
.v5 .imgbox{position:relative;flex:1}
/* 6 Phone mock */
.v6{background:linear-gradient(160deg,#fafaf8,#ecebe7);display:flex;flex-direction:column;align-items:center;padding:16px 16px 0}
.v6 .pill{background:#141414;color:#fff;align-self:flex-start}
.v6 .h{font-size:20px;align-self:stretch;margin-top:12px}
.v6 .sub{font-size:13.5px;color:#6e6e6e;line-height:1.35;margin-top:4px;align-self:stretch}
.v6 .phone{position:relative;margin-top:14px;width:72%;flex:1;border:6px solid #141414;border-bottom:0;border-radius:26px 26px 0 0;overflow:hidden;background:#141414}
.v6 .phone::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:34%;height:12px;border-radius:99px;background:#141414;z-index:2}
/* 7 Big type */
.v7 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.78),rgba(0,0,0,.25) 42%,transparent 60%)}
.v7 .nm{color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.v7 .h{color:#fff;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;letter-spacing:-.01em;line-height:1.02;margin-top:8px}
.v7 .sub{color:rgba(255,255,255,.88);font-size:13.5px;line-height:1.35;margin-top:8px}
/* 8 Ticket */
.v8{background:#fff;display:flex;flex-direction:column}
.v8 .imgbox{position:relative;flex:1}
.v8 .imgbox .pill{position:absolute;left:12px;top:12px;z-index:2}
.v8 .cut{position:relative;height:0;border-top:2px dashed #e2e2de;margin:0 14px}
.v8 .cut::before,.v8 .cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#f6f6f4}
.v8 .cut::before{left:-25px}.v8 .cut::after{right:-25px}
.v8 .txt{padding:14px 16px 16px}
.v8 .h{font-size:19px}
.v8 .sub{font-size:13.5px;color:#6e6e6e;line-height:1.35;margin-top:4px}
.v8 .cta{margin-top:10px;font-size:13px;font-weight:700;color:#141414}
/* 9 Dark */
.v9{background:#111;padding:10px;display:flex;flex-direction:column}
.v9 .imgbox{position:relative;flex:1;border-radius:15px;overflow:hidden}
.v9 .txt{padding:14px 6px 6px}
.v9 .nm{font-size:13px;font-weight:700;color:#7ee2a8}
.v9 .h{font-size:20px;color:#fff;margin-top:5px}
.v9 .sub{font-size:13.5px;color:#a3a3a3;line-height:1.35;margin-top:4px}
/* 10 Stack */
.stackwrap{position:relative;padding-top:14px}
.stackwrap::before,.stackwrap::after{content:"";position:absolute;left:8%;right:8%;top:0;height:40px;border-radius:22px 22px 0 0;background:#d9d8d3}
.stackwrap::after{left:4%;right:4%;top:7px;background:#c9c8c2}
.v10{z-index:1}
.v10 .panel{margin-top:auto;background:#fff;border-radius:16px;padding:14px}
.v10 .h{font-size:19px}
.v10 .sub{font-size:13.5px;color:#6e6e6e;line-height:1.35;margin-top:4px}
footer{height:90px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Phone card designs</h1>
  <p id="intro">10 card types in the hero card's portrait ratio (4:5, same as addflair.dev). Switch to 9:16 to see them as full phone screens.</p>
  <div class="bar"><div class="seg" id="seg"><button data-r="45" class="on">4:5 (hero)</button><button data-r="916">9:16 (phone)</button></div><nav id="nav"></nav></div>
</header>
<main id="main"></main>
<footer></footer>
</div>
<script>
const V=[[1,'Hero','Full photo, label pill, bold white text'],[2,'White frame','Photo inside a white card, text below'],[3,'Buy button','Shows the in-app purchase moment'],[4,'Glass','Frosted glass panel over the photo'],[5,'Colour block','Solid colour header, photo below'],[6,'Phone','The photo inside a phone frame'],[7,'Big serif','Large serif headline over the photo'],[8,'Ticket','Photo, cut line, copy and a call to action'],[9,'Dark','Black card, green app name'],[10,'Stack','Stacked cards with a white text panel']];
const BLK=['#b4232f','#c2185b','#e0662b','#1f5fbf','#2e7d32','#6a3fb5','#0e7c86','#8a5a00','#c0392b','#b0306a','#2f7d4f','#9c2f6d','#3b3b98','#7a4b2a','#5b6cb0'];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const src=c=>'/card-images/v3/'+c.image.split('/').pop();
function card(n,c){
 const P=`<div class="ph" style="background-image:url('${src(c)}')"></div>`,N=esc(c.name),H=esc(c.head),S=esc(c.sub),pill=`<span class="pill one"><i></i>${N}</span>`;
 const hs=`<div class="h one">${H}</div><div class="sub">${S}</div>`;
 switch(n){
 case 1:return `<div class="card v1">${P}<div class="fill"><div>${pill}</div><div class="bot">${hs}</div></div></div>`;
 case 2:return `<div class="card v2"><div class="imgbox">${P}${pill}</div><div class="txt">${hs}</div></div>`;
 case 3:return `<div class="card v3">${P}<div class="fill"><div class="nm one">${N}</div><div class="bot">${hs}<div class="buy"><span>Checkout in app</span><em>Buy</em></div></div></div></div>`;
 case 4:return `<div class="card v4">${P}<div class="fill"><div>${pill}</div><div class="glass"><div class="nm one">${N}</div>${hs}</div></div></div>`;
 case 5:return `<div class="card v5"><div class="blk" style="background:${BLK[(c.id-1)%BLK.length]}"><div class="nm one">${N}</div>${hs}</div><div class="imgbox">${P}</div></div>`;
 case 6:return `<div class="card v6">${pill}${hs}<div class="phone">${P}</div></div>`;
 case 7:return `<div class="card v7">${P}<div class="fill"><div class="nm one">${N}</div><div class="h one">${H}</div><div class="sub">${S}</div></div></div>`;
 case 8:return `<div class="card v8"><div class="imgbox">${P}${pill}</div><div class="cut"></div><div class="txt">${hs}<div class="cta">Buy in app &rarr;</div></div></div>`;
 case 9:return `<div class="card v9"><div class="imgbox">${P}</div><div class="txt"><div class="nm one">${N}</div>${hs}</div></div>`;
 case 10:return `<div class="stackwrap"><div class="card v10">${P}<div class="fill"><div>${pill}</div><div class="panel">${hs}</div></div></div></div>`;
 }}
function fit(){document.querySelectorAll('.one').forEach(h=>{h.style.fontSize='';let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+.5&&s>10){s-=.5;h.style.fontSize=s+'px';}});}
const q=new URLSearchParams(location.search);
if(q.get('r')==='916')document.body.classList.add('r916');
document.querySelectorAll('#seg button').forEach(b=>{if((q.get('r')==='916')===(b.dataset.r==='916'))b.classList.add('on');else b.classList.remove('on');b.onclick=()=>{q.set('r',b.dataset.r);if(b.dataset.r==='45')q.delete('r');location.search=q.toString();};});
fetch('/cards.json').then(r=>r.json()).then(cards=>{cards=cards.filter(c=>c.id<=15);
 const only=parseInt(q.get('v')), rq=q.get('r')==='916'?'&r=916':'';
 document.getElementById('nav').innerHTML=`<a href="/phone?${rq.slice(1)}" class="${only?'':'on'}">All 10</a>`+V.map(v=>`<a href="/phone?v=${v[0]}${rq}" class="${only===v[0]?'on':''}">${v[0]} ${v[1]}</a>`).join('');
 const list=only?V.filter(v=>v[0]===only):V, sample=[1,4,9,11];
 document.getElementById('main').innerHTML=list.map(v=>{const cs=only?cards:sample.map(i=>cards.find(c=>c.id===i));return `<section><div class="sh"><h2><b>${v[0]}</b>${v[1]}</h2><span>${v[2]}</span>${only?'':`<a href="/phone?v=${v[0]}${rq}">All 15 &rarr;</a>`}</div><div class="grid">${cs.map(c=>card(v[0],c)).join('')}</div></section>`}).join('');
 (document.fonts?document.fonts.ready:Promise.resolve()).then(fit);addEventListener('resize',fit);
});
</script>
</body>
</html>
