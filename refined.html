<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flair - refined card designs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;-webkit-font-smoothing:antialiased;background-color:#fafafa;background-image:radial-gradient(#e4e4e4 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
header{padding:64px 0 8px}
header h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
header p{margin-top:8px;color:#8a8a8a;font-size:14px;max-width:560px;line-height:1.55}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
nav a{font-size:13px;font-weight:500;color:#555;text-decoration:none;border:1px solid #e6e6e6;background:#fff;border-radius:8px;padding:6px 12px}
nav a.on{color:#111;border-color:#111}
section{padding:56px 0 0}
.sh{display:flex;align-items:baseline;gap:12px}
.sh h2{font-size:15px;font-weight:600}
.sh span{font-size:13px;color:#9a9a9a}
.sh a{margin-left:auto;font-size:13px;color:#555;text-decoration:none}
.sh a:hover{color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:18px}
.card{background:#fff;border:1px solid #ebebeb;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.img{aspect-ratio:3/2;border-radius:9px;background:#f2efe9 center/cover no-repeat}
.one{white-space:nowrap;overflow:hidden}
.sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* A */
.a .txt{padding:18px 6px 8px}
.a .name{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.a .head{font-size:14px;font-weight:500;color:#333;margin-top:10px}
.a .sub{font-size:13.5px;color:#8b8b8b;line-height:1.5;margin-top:3px}
/* B */
.b .txt{padding:16px 6px 8px}
.b .tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;border-radius:7px;padding:5px 10px;max-width:100%}
.b .tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b .head{font-size:18px;font-weight:600;letter-spacing:-.015em;margin-top:14px}
.b .sub{font-size:13.5px;color:#8b8b8b;line-height:1.5;margin-top:4px}
/* C */
.c .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 14px}
.c .name{font-size:17px;font-weight:600;letter-spacing:-.01em;min-width:0}
.c .arrow{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #ebebeb;display:grid;place-items:center;color:#999;font-size:13px}
.c .txt{padding:16px 6px 8px}
.c .head{font-size:14.5px;font-weight:600;color:#222}
.c .sub{font-size:13.5px;color:#8b8b8b;line-height:1.5;margin-top:3px}
footer{height:96px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Card designs, refined</h1>
  <p id="intro">Three calm versions. Thin borders, soft images, small type, more space. Head stays on one line, subhead two lines max.</p>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<footer></footer>
</div>
<script>
const V=[{k:'a',t:'A · Title',d:'App name leads, copy below'},{k:'b',t:'B · Tag',d:'App name as a coloured tag, head as title'},{k:'c',t:'C · Header',d:'App name above the image'}];
const TINTS=[['#fdecec','#c2412d'],['#eaf3ff','#2463c7'],['#eaf7ef','#23804b'],['#fff4e0','#b06a00'],['#f1ecff','#6b46c1'],['#e8f7f8','#16808a'],['#fdeef6','#b83280']];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=c=>'/card-images/v2/'+c.image.split('/').pop();
function card(k,c,i){
 const I=`<div class="img" style="background-image:url('${img(c)}')"></div>`,N=esc(c.name),H=esc(c.head),S=esc(c.sub);
 if(k==='a')return `<div class="card a">${I}<div class="txt"><div class="name one">${N}</div><div class="head one">${H}</div><div class="sub">${S}</div></div></div>`;
 if(k==='b'){const [bg,fg]=TINTS[i%TINTS.length];return `<div class="card b">${I}<div class="txt"><span class="tag one" style="background:${bg};color:${fg}"><i></i>${N}</span><div class="head one">${H}</div><div class="sub">${S}</div></div></div>`;}
 return `<div class="card c"><div class="top"><div class="name one">${N}</div><div class="arrow">&#8599;</div></div>${I}<div class="txt"><div class="head one">${H}</div><div class="sub">${S}</div></div></div>`;
}
function fit(){document.querySelectorAll('.one').forEach(h=>{h.style.fontSize='';let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+.5&&s>11){s-=.5;h.style.fontSize=s+'px';}});
 // same text size on every card in a version, so the grid stays even
 document.querySelectorAll('section').forEach(sec=>['.name','.head'].forEach(sel=>{const els=[...sec.querySelectorAll(sel)];if(!els.length)return;const m=Math.min(...els.map(e=>parseFloat(getComputedStyle(e).fontSize)));els.forEach(e=>e.style.fontSize=m+'px');}));}
fetch('/cards.json').then(r=>r.json()).then(cards=>{cards=cards.filter(c=>c.id<=15);
 const only=new URLSearchParams(location.search).get('v');
 document.getElementById('nav').innerHTML=`<a href="/refined" class="${only?'':'on'}">Compare</a>`+V.map(v=>`<a href="/refined?v=${v.k}" class="${only===v.k?'on':''}">${v.t} (all 15)</a>`).join('');
 const list=only?V.filter(v=>v.k===only):V, sample=[1,4,9,13];
 document.getElementById('main').innerHTML=list.map(v=>{const cs=only?cards:sample.map(i=>cards.find(c=>c.id===i));return `<section><div class="sh"><h2>${v.t}</h2><span>${v.d}</span>${only?'':`<a href="/refined?v=${v.k}">See all 15 &rarr;</a>`}</div><div class="grid">${cs.map(c=>card(v.k,c,c.id-1)).join('')}</div></section>`}).join('');
 (document.fonts?document.fonts.ready:Promise.resolve()).then(fit);addEventListener('resize',fit);
});
</script>
</body>
</html>
