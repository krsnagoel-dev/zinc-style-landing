<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flair - ICP cards</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ar:4/5}
body.r916{--ar:9/16}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f4f1;color:#151515;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:0 28px}
header{padding:56px 0 0}
header h1{font-family:"Bricolage Grotesque",Geist,sans-serif;font-weight:700;font-size:34px;letter-spacing:-.035em}
header p{margin-top:6px;color:#7a7a7a;font-size:15px;max-width:640px;line-height:1.5}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.seg{display:inline-flex;background:#fff;border:1px solid #e6e4df;border-radius:10px;padding:3px}
.seg a{font-size:13px;font-weight:500;text-decoration:none;padding:7px 12px;border-radius:7px;color:#666}
.seg a.on{background:#151515;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;margin:30px 0 90px}
/* card: final design (B, centered) */
.card{position:relative;aspect-ratio:var(--ar);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 40px -22px rgba(0,0,0,.25)}
.one{white-space:nowrap;overflow:hidden}
.name{position:absolute;left:18px;right:18px;top:22px;z-index:3;text-align:center;font-family:"Bricolage Grotesque",Geist,sans-serif;font-weight:700;font-size:27px;line-height:1.05;letter-spacing:-.035em;color:#151515}
.phone{position:absolute;left:50%;transform:translateX(-50%);top:70px;bottom:-40px;width:60%;border-radius:30px;overflow:hidden;z-index:1;border:2px solid #d4d2cd;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.9) inset,0 22px 44px -16px rgba(0,0,0,.3)}
.phone .ph{position:absolute;inset:0;background:#ccc center/cover no-repeat}
.phone::after{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:30%;height:9px;border-radius:99px;background:#1a1a1a;z-index:2}
.glass{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;text-align:center;border-radius:18px;padding:12px 15px 13px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 30px -12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
.glass .h{font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25;color:#141414}
.glass .sub{font-size:12.5px;line-height:1.4;margin-top:3px;color:#4d4b48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>ICP cards</h1>
  <p id="intro"></p>
  <div class="bar"><div class="seg" id="set"></div><div class="seg" id="ratio"></div></div>
</header>
<main class="grid" id="grid"></main>
</div>
<script>
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q=new URLSearchParams(location.search),all=q.get('set')==='all',is916=q.get('r')==='916';
if(is916)document.body.classList.add('r916');
const link=(k,v)=>{const p=new URLSearchParams(q);if(v)p.set(k,v);else p.delete(k);const s=p.toString();return '/cards'+(s?'?'+s:'');};
document.getElementById('set').innerHTML=`<a href="${link('set','')}" class="${all?'':'on'}">15 selected</a><a href="${link('set','all')}" class="${all?'on':''}">All 27</a>`;
document.getElementById('ratio').innerHTML=`<a href="${link('r','')}" class="${is916?'':'on'}">4:5</a><a href="${link('r','916')}" class="${is916?'on':''}">9:16</a>`;
function fit(){document.querySelectorAll('.one').forEach(h=>{h.style.fontSize='';let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>h.clientWidth+.5&&s>10){s-=.5;h.style.fontSize=s+'px';}});}
fetch('/cards.json').then(r=>r.json()).then(data=>{
 const cards=all?data:data.filter(c=>c.featured);
 document.getElementById('intro').textContent=`${cards.length} cards. Final layout: app name on top, thin phone frame, copy centered on a glass card. Copy and images come from cards.json.`;
 document.getElementById('grid').innerHTML=cards.map(c=>`<div class="card" style="background:linear-gradient(180deg,${c.background.from},${c.background.to})"><div class="name one">${esc(c.name)}</div><div class="phone"><div class="ph" style="background-image:url('${c.image}')"></div></div><div class="glass"><div class="h one">${esc(c.head)}</div><div class="sub">${esc(c.sub)}</div></div></div>`).join('');
 (document.fonts?document.fonts.ready:Promise.resolve()).then(fit);addEventListener('resize',fit);
});
</script>
</body>
</html>
